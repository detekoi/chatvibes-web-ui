<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta data-i18n-content="meta.pageNotFoundOnWildcattts" name="description" content="Page not found on WildcatTTS.">
    <title data-i18n="meta.pageNotFoundWildcattts">Page not found — WildcatTTS</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
    </noscript>

    <!-- Served at arbitrary paths, so every reference here is root-absolute. -->
    <link rel="stylesheet" href="/css/app.min.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('wildcat-tts-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="780" defer></script>
</head>

<body>
    <a data-i18n="page.skipToMainContent" href="#main-content" class="wc-skip-link">Skip to main content</a>

    <main id="main-content" class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>TTS</b></span>
                <span class="wc-readout">404</span>
            </div>

            <div class="wc-frame-body">
                <div class="wc-bignum" aria-hidden="true">404</div>
                <h1 data-i18n="mainContent.pageNotFound" class="wc-title wc-title--sm">Page not found</h1>
                <p data-i18n="mainContent.thatUrlIsNotPart" class="wc-lede">That URL is not part of this site. Make sure that the address is correct, or return to the login page.</p>
                <a data-i18n="mainContent.returnToLogin" href="/index.html" class="wc-btn wc-btn--ghost">Return to login</a>
            </div>

            <div data-i18n="mainContent.documentationTtsWildcatChat" class="wc-frame-foot">
                <a class="wc-link" href="https://docs.wildcat.chat/wildcatttsdocs.html" target="_blank" rel="noopener">Documentation</a>
                <span>tts.wildcat.chat</span>
            </div>
        </div>
    </main>

    <!-- Theme Management -->
    <script src="/js/theme.js"></script>
    <script type="module" src="js/common/i18n-boot.js"></script>
</body>

</html>
