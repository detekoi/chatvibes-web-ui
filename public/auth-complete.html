<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildcatTTS - Completing sign in</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/design-system.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('wildcat-tts-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Runs first, synchronously, and stays above the analytics tag below.
         The callback hands this page a seven-day session JWT in the query
         string. A deferred script still executes before DOMContentLoaded, so
         analytics would observe that URL long before the sign-in code further
         down gets to read it. Take the token out of the URL immediately and
         pass it along in memory instead. -->
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('session_token');
            if (!token) return;

            window.__sessionToken = token;

            params.delete('session_token');
            var query = params.toString();
            window.history.replaceState({}, '',
                window.location.pathname + (query ? '?' + query : '') + window.location.hash);
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="780" defer></script>
</head>

<body>
    <main class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>TTS</b></span>
                <span class="wc-readout wc-readout--accent" id="status-readout">
                    <span class="wc-dot"></span>Working
                </span>
            </div>

            <div class="wc-frame-body">
                <h1 class="wc-title wc-title--sm" id="auth-title">Signing you in</h1>
                <p class="wc-lede" id="auth-message" role="status" aria-live="polite">Please wait.</p>

                <ol class="wc-steps" id="auth-steps">
                    <li class="wc-step" data-step="authorized">Twitch authorized</li>
                    <li class="wc-step" data-step="token">Session token stored</li>
                    <li class="wc-step" data-step="redirect">Loading dashboard</li>
                </ol>

                <!-- Determinate: driven by the three real steps below, not a timer. -->
                <div class="wc-bar" id="auth-bar" role="progressbar" aria-label="Sign-in progress"><span></span></div>
            </div>

            <div class="wc-frame-foot">
                <span id="session-state">Establishing session</span>
                <span>tts.wildcat.chat</span>
            </div>
        </div>
    </main>

    <!-- Theme Management -->
    <script src="js/theme.js"></script>

    <script>
        // JWT parts are base64url, not base64: - and _ replace + and /, and the
        // padding is dropped. atob() rejects those two characters, so the segment
        // has to be normalised first. Mirrors decodeJwtPayload in common/auth.ts —
        // this page is a standalone script and cannot import the module.
        function decodeJwtPayload(token) {
            const segment = token.split('.')[1];
            if (!segment) return null;

            let base64 = segment.replace(/-/g, '+').replace(/_/g, '/');
            base64 += '='.repeat((4 - (base64.length % 4)) % 4);

            try {
                return JSON.parse(atob(base64));
            } catch (error) {
                console.warn('Could not decode JWT payload:', error);
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const messageEl = document.getElementById('auth-message');
            const titleEl = document.getElementById('auth-title');
            const readoutEl = document.getElementById('status-readout');
            const sessionStateEl = document.getElementById('session-state');
            const barEl = document.getElementById('auth-bar');

            // The three steps are real and discrete, so the bar reports actual
            // completion here instead of looping. It only ever advances on a
            // step that genuinely happened.
            function markStep(name) {
                const el = document.querySelector(`.wc-step[data-step="${name}"]`);
                if (el) el.classList.add('is-done');

                const steps = document.querySelectorAll('.wc-step');
                const done = document.querySelectorAll('.wc-step.is-done').length;
                const fill = barEl && barEl.querySelector('span');
                if (!fill || !steps.length) return;

                const pct = Math.round((done / steps.length) * 100);
                barEl.setAttribute('data-progress', String(pct));
                barEl.setAttribute('aria-valuemin', '0');
                barEl.setAttribute('aria-valuemax', '100');
                barEl.setAttribute('aria-valuenow', String(pct));
                fill.style.width = pct + '%';
            }

            function fail(message) {
                titleEl.textContent = 'Sign-in failed';
                messageEl.textContent = message;
                readoutEl.innerHTML = 'Failed';
                readoutEl.classList.remove('wc-readout--accent');
                readoutEl.classList.add('wc-readout--danger');
                sessionStateEl.textContent = 'No session';
                barEl.remove();
            }

            const queryParams = new URLSearchParams(window.location.search);

            const userLogin = queryParams.get('user_login');
            const userId = queryParams.get('user_id');
            const receivedState = queryParams.get('state');
            // Handed over in memory by the head script, which already removed
            // it from the URL. The query fallback only covers that script not
            // having run; it should normally be null by now.
            const sessionToken = window.__sessionToken || queryParams.get('session_token');

            // The server binds `state` to a one-use HttpOnly cookie and rejects
            // the callback before minting a token, so reaching this page means
            // that check already passed. This comparison is leftover
            // belt-and-braces from when the browser owned the check.
            //
            // It only runs when a stored state exists. Sign-in no longer writes
            // one, so a browser holding this page from cache cannot reject a
            // login that the server already accepted. Safe to delete once those
            // caches have rolled over.
            const storedState = sessionStorage.getItem('oauth_csrf_state');
            sessionStorage.removeItem('oauth_csrf_state'); // Clean up

            if (storedState && receivedState !== storedState) {
                console.error("CSRF state mismatch. Received:", receivedState, "Stored:", storedState);
                fail("Invalid state. This could be a security issue or a browser problem. Please try logging in again from the main page.");
                setTimeout(() => { window.location.href = 'index.html'; }, 5000);
                return;
            }

            if (userLogin && userId) {
                markStep('authorized');

                // Store user info more permanently
                localStorage.setItem('twitch_user_login', userLogin);
                localStorage.setItem('twitch_user_id', userId);

                if (sessionToken) {
                    // Store the session token for both app and viewer usage
                    localStorage.setItem('app_session_token', sessionToken);

                    // For viewer tokens, also store specific viewer auth info if available
                    try {
                        const payload = decodeJwtPayload(sessionToken);
                        if (payload) {
                            if (payload.scope === 'viewer') {
                                localStorage.setItem('token_user', payload.userLogin);
                                console.log("Viewer session token stored for user:", payload.userLogin);
                            } else {
                                // Streamer token - clear any old viewer-specific tokens
                                localStorage.removeItem('token_user');
                                localStorage.removeItem('token_channel');
                                console.log("Streamer session token stored, cleared viewer-specific tokens");
                            }
                        }
                    } catch (e) {
                        console.warn("Could not parse JWT payload:", e);
                    }

                    console.log("Session token stored in localStorage");
                    markStep('token');
                    sessionStateEl.textContent = 'Session established';
                } else {
                    console.warn("No session_token received in auth-complete.html query params!");
                    fail("Login complete, but the session token is missing. API calls would fail. Please try logging in again.");
                    return;
                }

                // Only the broadcaster flow reaches this page. The server sends
                // viewers straight to viewer-settings.html from the callback,
                // routing on the `t` marker in the state cookie rather than on
                // anything the browser remembered.
                titleEl.textContent = `Welcome, ${userLogin}`;
                markStep('redirect');

                messageEl.textContent = 'Redirecting to your dashboard.';
                window.location.href = 'dashboard.html';
            } else {
                fail("Missing user information from the Twitch callback. Please try again.");
                setTimeout(() => { window.location.href = 'index.html'; }, 5000);
            }
        });
    </script>
</body>

</html>
