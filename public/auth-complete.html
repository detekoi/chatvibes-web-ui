<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta data-i18n-content="meta.completingWildcatttsTwitchSignIn" name="description" content="Completing WildcatTTS Twitch sign in.">
    <title data-i18n="meta.wildcatttsCompletingSignIn">WildcatTTS - Completing sign in</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
    </noscript>

    <link rel="stylesheet" href="css/app.min.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('wildcat-tts-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Runs first, synchronously, and stays above the analytics tag below.
         The callback hands this page a one-time exchange code in the query
         string (and, for anyone mid-flow across the deploy, possibly still a
         session JWT). A deferred script still executes before DOMContentLoaded,
         so the analytics request would carry whichever of those is in the URL
         as its Referer. Take both out of the URL here and pass them on in
         memory instead. -->
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('session_token');
            var code = params.get('code');
            if (!token && !code) return;

            if (token) {
                window.__sessionToken = token;
                params.delete('session_token');
            }
            if (code) {
                window.__exchangeCode = code;
                params.delete('code');
            }

            var query = params.toString();
            window.history.replaceState({}, '',
                window.location.pathname + (query ? '?' + query : '') + window.location.hash);
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="780" defer></script>
</head>

<body>
    <a data-i18n="page.skipToMainContent" href="#main-content" class="wc-skip-link">Skip to main content</a>

    <main id="main-content" class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>TTS</b></span>
                <span data-i18n="statusReadout.working" class="wc-readout wc-readout--accent" id="status-readout">
                    <span class="wc-dot"></span>Working
                </span>
            </div>

            <div class="wc-frame-body">
                <h1 data-i18n="authTitle.signingYouIn" class="wc-title wc-title--sm" id="auth-title">Signing you in</h1>
                <p data-i18n="authMessage.pleaseWait" class="wc-lede" id="auth-message" role="status" aria-live="polite">Please wait.</p>

                <ol class="wc-steps" id="auth-steps">
                    <li data-i18n="authSteps.twitchAuthorized" class="wc-step" data-step="authorized">Twitch authorized</li>
                    <li data-i18n="authSteps.sessionTokenStored" class="wc-step" data-step="token">Session token stored</li>
                    <li data-i18n="authSteps.loadingDashboard" class="wc-step" data-step="redirect">Loading dashboard</li>
                </ol>

                <!-- Determinate: driven by the three real steps below, not a timer. -->
                <div data-i18n-aria-label="authBar.signInProgress" class="wc-bar" id="auth-bar" role="progressbar" aria-label="Sign-in progress"><span></span></div>
            </div>

            <div class="wc-frame-foot">
                <span data-i18n="sessionState.establishingSession" id="session-state">Establishing session</span>
                <span>tts.wildcat.chat</span>
            </div>
        </div>
    </main>

    <!-- Theme Management -->
    <script src="js/theme.js"></script>

    <script type="module" src="js/auth-complete.js"></script>
</body>

</html>
