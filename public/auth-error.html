<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta data-i18n-content="meta.wildcatttsAuthenticationErrorAndSign" name="description" content="WildcatTTS authentication error and sign-in recovery.">
    <title data-i18n="meta.wildcatttsAuthenticationError">WildcatTTS - Authentication Error</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap">
    </noscript>

    <!-- Custom overrides -->
    <link rel="stylesheet" href="css/app.min.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('wildcat-tts-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="780" defer></script>
    <!-- Lucide Icons -->
    <script src="js/vendor/lucide.min.js" defer></script>
</head>

<body>
    <a data-i18n="page.skipToMainContent" href="#main-content" class="wc-skip-link">Skip to main content</a>

    <main id="main-content" class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>TTS</b></span>
                <span data-i18n="errorReadout.authenticationFailed" class="wc-readout wc-readout--danger" id="error-readout">Authentication failed</span>
            </div>

            <div class="wc-frame-body">
                <h1 data-i18n="errorTitle.authenticationFailed" id="error-title" class="wc-title wc-title--sm">Authentication failed</h1>
                <p data-i18n="errorMessageDetails.twitchAuthenticationFailed" class="wc-lede" id="error-message-details">Twitch authentication failed.</p>

                <div class="wc-code" id="error-code-block">
                    <span data-i18n="errorCodeBlock.error" class="wc-code-label">Error</span>
                    <span data-i18n="errorCode.unknown" class="wc-code-value" id="error-code">unknown</span>
                </div>

                <a data-i18n="errorAction.tryAgain" href="index.html" class="wc-btn" id="error-action">Try again</a>
            </div>

            <div data-i18n="mainContent.requestAccessTtsWildcatChat" class="wc-frame-foot">
                <a class="wc-link" href="https://parfaitfair.com/#contact" target="_blank" rel="noopener">Request access</a>
                <span>tts.wildcat.chat</span>
            </div>
        </div>
    </main>


    <!-- Theme Management -->
    <script src="js/theme.js"></script>

    <script type="module" src="js/auth-error.js"></script>
</body>

</html>
