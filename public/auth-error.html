<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildcatTTS - Authentication Error</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom overrides -->
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/design-system.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('wildcat-tts-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="780" defer></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.min.js"></script>
</head>

<body>
    <main class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>TTS</b></span>
                <span class="wc-readout wc-readout--danger">Auth failed</span>
            </div>

            <div class="wc-frame-body">
                <h1 id="error-title" class="wc-title wc-title--sm">Authentication failed</h1>
                <p class="wc-lede" id="error-message-details">Sorry, there was a problem during the Twitch
                    authentication process.</p>

                <div class="wc-code">
                    <span class="wc-code-label">Error</span>
                    <span class="wc-code-value" id="error-code">unknown</span>
                </div>

                <a href="index.html" class="wc-btn">Try again</a>
            </div>

            <div class="wc-frame-foot">
                <a class="wc-link" href="https://parfaitfair.com/#contact" target="_blank" rel="noopener">Request access</a>
                <span>tts.wildcat.chat</span>
            </div>
        </div>
    </main>

    <script>
        // Display error details from URL parameters
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            const errorDescription = params.get('error_description');
            const errorMessageEl = document.getElementById('error-message-details');
            const errorTitleEl = document.getElementById('error-title');
            const errorCodeEl = document.getElementById('error-code');

            if (errorCodeEl) {
                errorCodeEl.textContent = error || 'unspecified';
            }

            // URLSearchParams has already decoded these. Decoding a second time
            // throws URIError on any literal "%" in the text, which would halt
            // this script and leave the page blank.
            if (errorMessageEl) {
                let message = '';
                if (error === 'access_denied') {
                    // Twitch sends "The user denied you access", which is
                    // written from our side of the transaction, not the user's.
                    message = "You canceled the login before authorizing.";
                } else if (errorDescription) {
                    message = errorDescription;
                } else if (error) {
                    message = 'Twitch returned an error during authentication.';
                } else {
                    message = 'An unspecified error occurred.';
                }
                errorMessageEl.textContent = message;

                // Append a clickable "Contact Me" link for not_authorized errors
                if (error === 'not_authorized') {
                    errorMessageEl.appendChild(document.createTextNode(' '));
                    const link = document.createElement('a');
                    link.href = 'https://parfaitfair.com/#contact';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = 'Contact Me';
                    link.style.textDecoration = 'underline';
                    errorMessageEl.appendChild(link);
                }
            }

            if (errorTitleEl && error === 'access_denied') {
                errorTitleEl.textContent = 'Login canceled';
            } else if (errorTitleEl && error === 'not_allowed') {
                errorTitleEl.textContent = 'Access not permitted';
            }
        });
    </script>

    <!-- Theme Management -->
    <script src="js/theme.js"></script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
